# coturn configuration for SkyTalk
# Replace DOMAIN with your actual subdomain (e.g. skytalk.example.com).
# Replace TURN_SECRET with a strong random string — must match
# SKYTALK_TURN_SECRET in /etc/skytalk/skytalk.env.
# Generate a secret: openssl rand -hex 32

# Listening ports
listening-port=3478
tls-listening-port=5349

# Bind to all interfaces; add listening-ip= to restrict to a specific NIC
# listening-ip=0.0.0.0

# Realm — must match the domain clients use when connecting
realm=skytalk.DOMAIN

# HMAC-based time-limited credentials (REST API model).
# The server generates per-session credentials in turn-creds.ts using this secret.
# NOTE: This uses use-auth-secret (not lt-cred-mech). The architecture doc mentions
# "lt-cred-mech" but the HMAC/per-session model requires use-auth-secret — these are
# mutually exclusive coturn modes. use-auth-secret is the correct choice here.
use-auth-secret
static-auth-secret=TURN_SECRET

# TLS certificates — reuse the same Let's Encrypt cert as nginx
cert=/etc/letsencrypt/live/skytalk.DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/skytalk.DOMAIN/privkey.pem

# DTLS fingerprint — required for WebRTC compatibility
fingerprint

# Relay port range (must be open in firewall: UDP 49152-65535)
min-port=49152
max-port=65535

# Logging
log-file=/var/log/turnserver/turnserver.log
pidfile=/var/run/turnserver/turnserver.pid

# Disable management CLI (no attack surface)
no-cli

# Prevent TURN server from being used as an open proxy
# (denied-peer-ip blocks relay to RFC1918 ranges)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
