# coturn configuration for SkyTalk
# Installed by infra/coturn/install-coturn.sh, which substitutes the placeholders:
#   DOMAIN      — public hostname (e.g. skytalk.website)
#   EXTERNAL_IP — public IPv4 address of the VPS
#   TURN_SECRET — must match SKYTALK_TURN_SECRET in /etc/skytalk/skytalk.env
# Generate a secret: openssl rand -hex 32

# Listening ports
listening-port=3478
tls-listening-port=5349

# Bind to all interfaces; add listening-ip= to restrict to a specific NIC
# listening-ip=0.0.0.0

# Public address advertised in relay candidates (required when the VPS sits behind 1:1 NAT,
# harmless when the address is bound directly)
external-ip=EXTERNAL_IP

# Realm — must match the domain clients use when connecting
realm=DOMAIN

# HMAC-based time-limited credentials (REST API model).
# The server generates per-session credentials in turn-creds.ts using this secret.
# NOTE: This uses use-auth-secret (not lt-cred-mech). The architecture doc mentions
# "lt-cred-mech" but the HMAC/per-session model requires use-auth-secret — these are
# mutually exclusive coturn modes. use-auth-secret is the correct choice here.
use-auth-secret
static-auth-secret=TURN_SECRET

# TLS certificates — copies of the nginx Let's Encrypt cert.
# coturn runs as user "turnserver" and cannot read /etc/letsencrypt/live (root-only),
# so a certbot deploy hook copies them here on every renewal (see install-coturn.sh).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# DTLS fingerprint — required for WebRTC compatibility
fingerprint

# Relay port range (must be open in firewall: UDP 49152-65535)
min-port=49152
max-port=65535

# Logging — to syslog, so it lands in journald: journalctl -u coturn
syslog

# Disable management CLI (no attack surface)
no-cli

# Prevent TURN server from being used as an open proxy:
# no relaying to loopback (would expose Fastify :3001 and PeerServer :9000), RFC1918 or multicast
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
