# SkyTalk nginx configuration
# Replace DOMAIN with your actual subdomain (e.g. skytalk.example.com).
# certbot will fill in ssl_certificate / ssl_certificate_key automatically.
# Copy to /etc/nginx/sites-available/skytalk and symlink to sites-enabled/.

# Magic-link tokens travel in query strings (?token=…) and in the Referer of every request
# the lesson page makes — mask both in the access log. This file is included in the http {}
# context, so map/log_format are allowed here; names are prefixed to stay clear of other
# sites on the same VPS.
map $request $skytalk_request {
    "~^(?<skytalk_rq_pre>[^ ]+ [^?]*\?(?:[^ ]*&)?token=)[^& ]*(?<skytalk_rq_post>.*)$" "${skytalk_rq_pre}REDACTED${skytalk_rq_post}";
    default $request;
}
map $http_referer $skytalk_referer {
    "~^(?<skytalk_ref_pre>[^?]*\?(?:.*&)?token=)[^&]*(?<skytalk_ref_post>.*)$" "${skytalk_ref_pre}REDACTED${skytalk_ref_post}";
    default $http_referer;
}
log_format skytalk_redacted '$remote_addr - $remote_user [$time_local] "$skytalk_request" '
                            '$status $body_bytes_sent "$skytalk_referer" "$http_user_agent"';

# HTTP → HTTPS redirect + certbot ACME passthrough
server {
    listen 80;
    server_name skytalk.website;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main TLS server block
server {
    listen 443 ssl http2;
    server_name skytalk.website;

    # TLS — managed by certbot; do not edit these two lines by hand
    ssl_certificate     /etc/letsencrypt/live/skytalk.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skytalk.website/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/skytalk.access.log skytalk_redacted;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;

    # Compression for static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static frontend (Vite build output)
    root  /var/www/skytalk;
    index landing.html index.html;

    # SPA fallback — non-asset paths serve index.html; / serves landing.html via index directive
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → Fastify backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket lesson channel → Fastify backend
    # Long timeout: WebSocket connections persist for the full session duration.
    location /ws/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # PeerJS signaling server (WebRTC handshake only — media is P2P)
    location /peerjs/ {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
    }
}
